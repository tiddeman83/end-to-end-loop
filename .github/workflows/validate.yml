name: Validate skill

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Compile Python helpers
        run: python3 -m compileall -q scripts
      - name: Test executable loop kernel
        run: python3 scripts/test_loop_kernel.py
      - name: Test minimal runtime packaging
        run: python3 scripts/test_package_runtime.py
      - name: Test telemetry privacy
        run: python3 scripts/test_telemetry_privacy.py
      - name: Validate skill repository
        run: python3 scripts/validate_skill.py .
      - name: Smoke-test minimal installation
        run: |
          install_home="$(mktemp -d)"
          HOME="$install_home" bash scripts/install.sh
          test -f "$install_home/.agents/skills/end-to-end-loop/scripts/loop_kernel.py"
          test ! -e "$install_home/.agents/skills/end-to-end-loop/evals"
