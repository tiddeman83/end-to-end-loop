name: Validate skill

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill repository
        run: python3 scripts/validate_skill.py .
      - name: Compile helper scripts
        run: python3 -m py_compile scripts/*.py
      - name: Telemetry privacy self-test
        run: python3 scripts/test_telemetry_privacy.py
