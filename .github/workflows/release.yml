name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Verify tag matches VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(tr -d '\n' < VERSION)"
      - name: Run release gates
        run: |
          python3 -m compileall -q scripts
          python3 scripts/test_loop_kernel.py
          python3 scripts/test_package_runtime.py
          python3 scripts/test_telemetry_privacy.py
          python3 scripts/validate_skill.py .
      - name: Build deterministic runtime archive
        run: |
          mkdir -p dist
          python3 scripts/package_runtime.py --check --build "dist/end-to-end-loop-${GITHUB_REF_NAME}.zip" > dist/runtime-package-report.json
          shasum -a 256 dist/*.zip > dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
